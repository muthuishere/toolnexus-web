name: publish
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write   # npm trusted publishing (OIDC) — no tokens

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No registry-url: setup-node's _authToken placeholder would shadow the
      # OIDC exchange and break trusted publishing.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Ensure npm with OIDC support
        run: npm install -g npm@latest && npm --version
      - run: npm ci
      - run: npm test
      - name: Publish (OIDC trusted publishing)
        run: npm publish --access public
      # Ask for the version this tag published, not whatever is latest: a
      # staged publish (awaiting approval on npmjs.com) leaves the old version
      # as latest, and printing that passed as success for v0.9.0.
      - name: Confirm on registry
        run: |
          want="${GITHUB_REF_NAME#v}"
          for i in 1 2 3 4 5 6; do
            got=$(npm view "toolnexus-web@$want" version 2>/dev/null || true)
            [ "$got" = "$want" ] && { echo "toolnexus-web@$want is public"; exit 0; }
            sleep 10
          done
          echo "::error::toolnexus-web@$want is not on the registry — if it was staged, approve it on npmjs.com"
          exit 1
