name: publish
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write   # npm trusted publishing (OIDC) — no tokens

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No registry-url: setup-node's _authToken placeholder would shadow the
      # OIDC exchange and break trusted publishing.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Ensure npm with OIDC support
        run: npm install -g npm@latest && npm --version
      - run: npm ci
      - run: npm test
      - name: Publish (OIDC trusted publishing)
        run: npm publish --access public
      - name: Confirm on registry
        run: |
          sleep 10
          npm view toolnexus-web version
